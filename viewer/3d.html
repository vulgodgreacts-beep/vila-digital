<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vila Digital — 3D</title>
<style>
:root{--tinta:#E8EAE4;--tinta-fraca:#A8B0A6;--painel:rgba(22,30,27,.86);--borda:rgba(232,234,228,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0E1614;
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,sans-serif;color:var(--tinta)}
#cena{position:fixed;inset:0}
canvas{display:block}

.hud{position:fixed;z-index:5;background:var(--painel);border:1px solid var(--borda);
  backdrop-filter:blur(8px);padding:11px 15px}
#topo{top:16px;left:16px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;max-width:min(640px,calc(100vw - 32px))}
#topo h1{font-size:17px;font-weight:600;margin:0;letter-spacing:.01em}
#relogio{font-size:15px;color:var(--tinta-fraca);font-variant-numeric:tabular-nums}
#condicoes{font-size:12.5px;color:var(--tinta-fraca);width:100%}
#condicoes b{color:var(--tinta);font-weight:500}

#controles{bottom:16px;left:16px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
button{font:inherit;font-size:14px;font-weight:500;color:var(--tinta);background:rgba(232,234,228,.09);
  border:1px solid var(--borda);padding:6px 14px;cursor:pointer;transition:background .12s}
button:hover{background:rgba(232,234,228,.17)}
button:focus-visible{outline:2px solid #86B8A0;outline-offset:2px}
input[type=range]{width:200px;accent-color:#86B8A0}
#dica{font-size:12px;color:var(--tinta-fraca)}

#registro{top:16px;right:16px;width:min(330px,calc(100vw - 32px));max-height:52vh;
  display:flex;flex-direction:column;padding:0}
#registro h2{font-size:13px;font-weight:600;margin:0;padding:11px 15px 9px;border-bottom:1px solid var(--borda)}
#falas{overflow-y:auto;padding:11px 15px;scrollbar-width:thin}
#falas .linha{margin-bottom:10px;padding-left:9px;border-left:2px solid currentColor;font-size:13px}
#falas .quem{font-weight:600;font-size:12.5px}
#falas .txt{color:var(--tinta);line-height:1.5;margin-top:1px}
#falas .evento{color:#E8A87C;border-left-color:#E8A87C;padding-left:9px;font-size:12.5px;margin-bottom:10px}
#falas .nada{color:var(--tinta-fraca);font-style:italic;font-size:13px}

.balao{position:fixed;z-index:4;font-size:12px;pointer-events:none;transform:translate(-50%,-100%);
  max-width:180px;padding:6px 9px;background:rgba(18,26,23,.92);border:1px solid var(--borda);
  border-radius:3px;font-size:12.5px;line-height:1.45;opacity:0;transition:opacity .35s}
.balao.on{opacity:1}
.balao .dono{display:block;font-weight:600;font-size:12px;margin-bottom:2px}
.balao::after{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-5px;
  border:5px solid transparent;border-top-color:rgba(18,26,23,.92);border-bottom:0}

#carregando{position:fixed;inset:0;display:grid;place-items:center;background:#0E1614;z-index:9;font-size:14px;color:var(--tinta-fraca)}
@media (max-width:760px){#registro{display:none}#topo{max-width:calc(100vw - 32px)}}
</style>
</head>
<body>
<div id="cena"></div>
<div id="carregando">carregando a vila…</div>

<div class="hud" id="topo">
  <h1 id="titulo">Vila Digital</h1>
  <span id="relogio">tick 0 / 0</span>
  <span id="condicoes"></span>
</div>

<div class="hud" id="registro">
  <h2>Registro</h2>
  <div id="falas"><p class="nada">Sem registros ainda.</p></div>
</div>

<div class="hud" id="controles">
  <button id="btnPlay">Reproduzir</button>
  <input type="range" id="linha" min="0" max="0" value="0" aria-label="Linha do tempo">
  <span id="dica">arraste para girar · roda do mouse para aproximar</span>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/loaders/GLTFLoader.js";
import { VRMLoaderPlugin, VRMUtils } from "./vendor/three-vrm.module.min.js";

const CORES = [0x2FA98A, 0x4A8FC4, 0xC9A227, 0xA97FB0, 0x7FB05A];
// onde cada lugar fica no terreno (x, z)
const PONTOS = {
  "oficina":[-17,-13], "biblioteca":[17,-13], "praça central":[0,3],
  "praca central":[0,3], "mercado":[0,21]
};
const ponto = n => PONTOS[n] || PONTOS[n?.normalize("NFD").replace(/[\u0300-\u036f]/g,"")] || PONTOS["praça central"];

/* ---------- texturas geradas por canvas (sem nenhum arquivo externo) ---------- */
function _tex(cv, repX=1, repY=1){
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repX, repY);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function texturaGrama(){
  const cv = document.createElement("canvas"); cv.width = cv.height = 256;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#3C5140"; ctx.fillRect(0,0,256,256);
  for(let i=0;i<2600;i++){
    const x = Math.random()*256, y = Math.random()*256, l = 2+Math.random()*5;
    ctx.strokeStyle = `hsl(100,${22+Math.random()*16}%,${16+Math.random()*15}%)`;
    ctx.lineWidth = 1+Math.random();
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+(Math.random()-.5)*2, y-l); ctx.stroke();
  }
  return _tex(cv, 60, 60);
}

function texturaPedra(){
  const cv = document.createElement("canvas"); cv.width = cv.height = 256;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#8A8272"; ctx.fillRect(0,0,256,256);
  const passo = 46;
  for(let gy=-1; gy<7; gy++) for(let gx=-1; gx<7; gx++){
    const ox=(Math.random()-.5)*10, oy=(Math.random()-.5)*10;
    const w=passo-7+Math.random()*8, h=passo-7+Math.random()*8;
    ctx.fillStyle = `hsl(34,${10+Math.random()*8}%,${44+Math.random()*11}%)`;
    const px=gx*passo+ox, py=gy*passo+oy;
    ctx.fillRect(px,py,w,h);
    ctx.strokeStyle = "rgba(35,30,24,.45)"; ctx.lineWidth=2.5; ctx.strokeRect(px,py,w,h);
  }
  return _tex(cv, 7, 7);
}

function texturaParede(corBase){
  const cv = document.createElement("canvas"); cv.width = cv.height = 256;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = corBase; ctx.fillRect(0,0,256,256);
  for(let i=0;i<950;i++){
    const x=Math.random()*256, y=Math.random()*256, r=6+Math.random()*15;
    ctx.fillStyle = `rgba(0,0,0,${Math.random()*.035})`;
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  }
  return _tex(cv, 3, 2);
}

function texturaMetal(){
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#7C868C"; ctx.fillRect(0,0,128,128);
  for(let x=0;x<128;x+=8){
    const grad = ctx.createLinearGradient(x,0,x+8,0);
    grad.addColorStop(0,"rgba(255,255,255,.2)");
    grad.addColorStop(.5,"rgba(0,0,0,.14)");
    grad.addColorStop(1,"rgba(255,255,255,.05)");
    ctx.fillStyle = grad; ctx.fillRect(x,0,8,128);
  }
  for(let i=0;i<45;i++){
    ctx.fillStyle = `rgba(120,70,40,${Math.random()*.16})`;
    ctx.beginPath(); ctx.arc(Math.random()*128,Math.random()*128,2+Math.random()*5,0,Math.PI*2); ctx.fill();
  }
  return _tex(cv, 4, 2);
}

function texturaMadeira(cor){
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = cor; ctx.fillRect(0,0,128,128);
  for(let x=0;x<128;x+=21){
    ctx.strokeStyle = "rgba(0,0,0,.35)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,128); ctx.stroke();
  }
  for(let i=0;i<220;i++){
    ctx.strokeStyle = `rgba(0,0,0,${Math.random()*.08})`;
    const y=Math.random()*128;
    ctx.beginPath(); ctx.moveTo(Math.random()*128,y); ctx.lineTo(Math.random()*128,y); ctx.stroke();
  }
  return _tex(cv, 1, 1);
}

function texturaTelha(cor){
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = cor; ctx.fillRect(0,0,128,128);
  ctx.fillStyle = "rgba(0,0,0,.2)";
  for(let y=0;y<128;y+=16) for(let x=0;x<128;x+=20){
    const off = (y/16)%2===0 ? 0 : 10;
    ctx.beginPath(); ctx.arc(x+off,y+8,9,0,Math.PI,true); ctx.fill();
  }
  return _tex(cv, 2, 2);
}

function texturaListrado(corA, corB){
  const cv = document.createElement("canvas"); cv.width = cv.height = 128;
  const ctx = cv.getContext("2d");
  for(let x=0;x<128;x+=16){ ctx.fillStyle=(x/16)%2===0?corA:corB; ctx.fillRect(x,0,16,128); }
  return _tex(cv, 3, 1);
}


// altura, em unidades da cena, que todo personagem é escalado pra ter —
// carrega vindo em metros de verdade (~1.5-1.7), aqui vira do tamanho dos prédios
const ALTURA_PERSONAGEM = 3.0;
const OSSOS_USADOS = ["hips","spine","leftUpperLeg","rightUpperLeg","leftLowerLeg","rightLowerLeg",
                      "leftUpperArm","rightUpperArm","leftLowerArm","rightLowerArm"];

let cena, camera, render3d, relogio3d;
let ticks=[], locais={}, corDe={}, inicioDe={}, personagens={}, baloes={};
let atual=0, tocando=false, timer=null, assinatura="";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- cena ---------- */
function montarCena(){
  cena = new THREE.Scene();
  cena.background = new THREE.Color(0x121D1A);
  cena.fog = new THREE.Fog(0x121D1A, 72, 168);

  camera = new THREE.PerspectiveCamera(48, innerWidth/innerHeight, 0.1, 500);
  render3d = new THREE.WebGLRenderer({antialias:true});
  render3d.setPixelRatio(Math.min(devicePixelRatio,2));
  render3d.setSize(innerWidth, innerHeight);
  render3d.shadowMap.enabled = true;
  render3d.shadowMap.type = THREE.PCFSoftShadowMap;
  render3d.outputColorSpace = THREE.SRGBColorSpace;
  render3d.toneMapping = THREE.ACESFilmicToneMapping;
  render3d.toneMappingExposure = 1.15;
  $("cena").appendChild(render3d.domElement);
  relogio3d = new THREE.Clock();

  cena.add(new THREE.HemisphereLight(0xCFE0D6, 0x33403A, 2.4));
  const sol = new THREE.DirectionalLight(0xFFF3DC, 3.1);
  sol.position.set(26, 38, 16); sol.castShadow = true;
  sol.shadow.mapSize.set(2048,2048);
  const c = sol.shadow.camera;
  c.left=-55; c.right=55; c.top=55; c.bottom=-55; c.near=1; c.far=110;
  cena.add(sol);

  // terreno
  const chao = new THREE.Mesh(
    new THREE.PlaneGeometry(420,420),
    new THREE.MeshLambertMaterial({map:texturaGrama()}));
  chao.rotation.x = -Math.PI/2; chao.receiveShadow = true;
  cena.add(chao);

  // caminhos ligando cada lugar à praça
  const matCaminho = new THREE.MeshLambertMaterial({color:0x6E6A5C});
  for(const nome of ["oficina","biblioteca","mercado"]){
    const [x,z] = PONTOS[nome], [px,pz] = PONTOS["praça central"];
    const dx = px-x, dz = pz-z, comp = Math.hypot(dx,dz);
    const via = new THREE.Mesh(new THREE.PlaneGeometry(3.4, comp), matCaminho);
    via.rotation.x = -Math.PI/2;
    via.rotation.z = -Math.atan2(dx,dz);
    via.position.set((x+px)/2, 0.02, (z+pz)/2);
    via.receiveShadow = true;
    cena.add(via);
  }

  montarPraca();
  animar();
}

function montarPraca(){
  const [x,z] = PONTOS["praça central"];
  const piso = new THREE.Mesh(new THREE.CylinderGeometry(11,11,.25,10),
    new THREE.MeshLambertMaterial({map:texturaPedra()}));
  piso.position.set(x,.12,z); piso.receiveShadow = true; cena.add(piso);

  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.6,3,.9,8),
    new THREE.MeshLambertMaterial({color:0x9A9486}));
  base.position.set(x,.6,z); base.castShadow = base.receiveShadow = true; cena.add(base);

  const agua = new THREE.Mesh(new THREE.CylinderGeometry(2.3,2.3,.14,8),
    new THREE.MeshLambertMaterial({color:0x4E7F8C}));
  agua.position.set(x,1.06,z); cena.add(agua);

  const coluna = new THREE.Mesh(new THREE.CylinderGeometry(.42,.6,2.3,6),
    new THREE.MeshLambertMaterial({color:0x9A9486}));
  coluna.position.set(x,2.1,z); coluna.castShadow = true; cena.add(coluna);

  for(let i=0;i<7;i++){
    const ang = i/7*Math.PI*2;
    const arv = new THREE.Group();
    const tronco = new THREE.Mesh(new THREE.CylinderGeometry(.26,.34,2.1,6),
      new THREE.MeshLambertMaterial({color:0x5A4632}));
    tronco.position.y = 1.05; tronco.castShadow = true;
    const copa = new THREE.Mesh(new THREE.SphereGeometry(1.9,6,5),
      new THREE.MeshLambertMaterial({color:0x4C7A43}));
    copa.position.y = 3.2; copa.scale.y = .85; copa.castShadow = true;
    arv.add(tronco, copa);
    arv.position.set(x + Math.cos(ang)*14.5, 0, z + Math.sin(ang)*14.5);
    cena.add(arv);
  }
}

function tipoDoLocal(nome){
  const n = nome.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
  if(n.includes("ofic")) return "oficina";
  if(n.includes("bibliot")) return "biblioteca";
  if(n.includes("merc")) return "mercado";
  return "generico";
}

function adicionarPlaca(nome, x, z, altura){
  const placa = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 1.3), letreiro(nome));
  placa.position.set(x, altura, z);
  placa.userData.placa = true;
  cena.add(placa);
}

function virarPraPraca(g, x, z){
  g.position.set(x, 0, z);
  g.lookAt(PONTOS["praça central"][0], 0, PONTOS["praça central"][1]);
  cena.add(g);
}

function montarPredio(nome, corPadrao){
  const [x,z] = ponto(nome);
  if(nome.includes("praça") || nome.includes("praca")) return;
  switch(tipoDoLocal(nome)){
    case "oficina":    return construirOficina(nome, x, z);
    case "biblioteca": return construirBiblioteca(nome, x, z);
    case "mercado":    return construirMercado(nome, x, z);
    default:           return construirCasaGenerica(nome, x, z, corPadrao);
  }
}

/* ---------- oficina: galpão de metal, vão aberto, ferramentas ---------- */
function construirOficina(nome, x, z){
  const g = new THREE.Group();
  const larg = 10, prof = 8, alt = 4.6;

  const matParede = new THREE.MeshLambertMaterial({map:texturaMetal()});
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(larg,alt,prof), matParede);
  corpo.position.y = alt/2; corpo.castShadow = corpo.receiveShadow = true; g.add(corpo);

  const telhado = new THREE.Mesh(new THREE.BoxGeometry(larg+.6,.35,prof+.6),
    new THREE.MeshLambertMaterial({color:0x46423C}));
  telhado.position.y = alt+.18; telhado.castShadow = true; g.add(telhado);

  // vão aberto da garagem, com moldura
  const moldura = new THREE.Mesh(new THREE.BoxGeometry(5.6,3.8,.2),
    new THREE.MeshLambertMaterial({color:0x2E2A24}));
  moldura.position.set(-1.4, 1.9, prof/2+.02); g.add(moldura);
  const vao = new THREE.Mesh(new THREE.BoxGeometry(5.1,3.3,.1),
    new THREE.MeshLambertMaterial({color:0x100D0A}));
  vao.position.set(-1.4, 1.75, prof/2+.13); g.add(vao);

  const jan = new THREE.Mesh(new THREE.BoxGeometry(1.3,1.3,.1),
    new THREE.MeshLambertMaterial({color:0x2E4A50}));
  jan.position.set(3.6, 2.9, prof/2+.02); g.add(jan);

  // pilha de pneus
  const matPneu = new THREE.MeshLambertMaterial({color:0x1B1B1B});
  for(let i=0;i<3;i++){
    const pneu = new THREE.Mesh(new THREE.TorusGeometry(.55,.22,8,14), matPneu);
    pneu.rotation.x = Math.PI/2; pneu.position.set(4.7,.32+i*.42,prof/2+1.7);
    pneu.castShadow = true; g.add(pneu);
  }

  // bancada com ferramentas
  const bancada = new THREE.Mesh(new THREE.BoxGeometry(2.1,.9,.8),
    new THREE.MeshLambertMaterial({map:texturaMadeira("#5B4632")}));
  bancada.position.set(-4.6,.45,prof/2+1.5); bancada.castShadow = true; g.add(bancada);

  const matFerramenta = new THREE.MeshLambertMaterial({color:0xB0B4B8});
  const chave = new THREE.Mesh(new THREE.BoxGeometry(.55,.08,.12), matFerramenta);
  chave.position.set(-5.1,.95,prof/2+1.3); chave.rotation.z = .4; g.add(chave);

  const martelo = new THREE.Group();
  const cabo = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.5,6),
    new THREE.MeshLambertMaterial({color:0x6B4A30}));
  const cabeca = new THREE.Mesh(new THREE.BoxGeometry(.28,.14,.14), matFerramenta);
  cabeca.position.y = .27; martelo.add(cabo, cabeca);
  martelo.position.set(-4.3,.95,prof/2+1.6); martelo.rotation.z = -.3; g.add(martelo);

  const barril = new THREE.Mesh(new THREE.CylinderGeometry(.42,.42,1.0,10),
    new THREE.MeshLambertMaterial({color:0x8C3B24}));
  barril.position.set(4.6,.5,prof/2-1.3); barril.castShadow = true; g.add(barril);

  virarPraPraca(g, x, z);
  adicionarPlaca(nome, x, z, alt+2.1);
}

/* ---------- biblioteca: prédio cívico, colunas, janelas em arco ---------- */
function construirBiblioteca(nome, x, z){
  const g = new THREE.Group();
  const larg = 8, prof = 8.5, alt = 6.2;

  const matParede = new THREE.MeshLambertMaterial({map:texturaParede("#E6DDC8")});
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(larg,alt,prof), matParede);
  corpo.position.y = alt/2; corpo.castShadow = corpo.receiveShadow = true; g.add(corpo);

  const telhado = new THREE.Mesh(new THREE.ConeGeometry(larg*.78,3.4,4),
    new THREE.MeshLambertMaterial({map:texturaTelha("#5C6B4A")}));
  telhado.position.y = alt+1.7; telhado.rotation.y = Math.PI/4; telhado.castShadow = true; g.add(telhado);

  const matColuna = new THREE.MeshLambertMaterial({color:0xEDE6D6});
  for(const dx of [-1.6,1.6]){
    const col = new THREE.Mesh(new THREE.CylinderGeometry(.26,.3,4.2,10), matColuna);
    col.position.set(dx,2.1,prof/2+.28); col.castShadow = true; g.add(col);
  }

  const matPorta = new THREE.MeshLambertMaterial({map:texturaMadeira("#4A3524")});
  const porta = new THREE.Mesh(new THREE.BoxGeometry(1.7,3,.16), matPorta);
  porta.position.set(0,1.5,prof/2+.05); g.add(porta);
  const arco = new THREE.Mesh(new THREE.CircleGeometry(.85,16,0,Math.PI), matPorta);
  arco.rotation.y = Math.PI; arco.position.set(0,3.0,prof/2+.05); g.add(arco);

  const matVidro = new THREE.MeshLambertMaterial({color:0x3C5A5E});
  for(const dx of [-2.9,2.9]){
    const jan = new THREE.Mesh(new THREE.BoxGeometry(1.3,2.0,.1), matVidro);
    jan.position.set(dx,3.1,prof/2+.02); g.add(jan);
    const topo = new THREE.Mesh(new THREE.CircleGeometry(.65,12,0,Math.PI), matVidro);
    topo.rotation.y = Math.PI; topo.position.set(dx,4.1,prof/2+.02); g.add(topo);
  }

  const poste = new THREE.Group();
  const haste = new THREE.Mesh(new THREE.CylinderGeometry(.05,.07,2.4,8),
    new THREE.MeshLambertMaterial({color:0x2B241E}));
  haste.position.y = 1.2;
  const lanterna = new THREE.Mesh(new THREE.BoxGeometry(.3,.36,.3),
    new THREE.MeshLambertMaterial({color:0xF3D9A0, emissive:0xF3D9A0, emissiveIntensity:.55}));
  lanterna.position.y = 2.5;
  poste.add(haste, lanterna);
  poste.position.set(-4.6,0,prof/2+2.4); g.add(poste);

  const banco = new THREE.Group();
  const assento = new THREE.Mesh(new THREE.BoxGeometry(1.6,.14,.5),
    new THREE.MeshLambertMaterial({map:texturaMadeira("#6B4A30")}));
  assento.position.y = .5; banco.add(assento);
  for(const dx of [-.65,.65]){
    const perna = new THREE.Mesh(new THREE.BoxGeometry(.12,.5,.45),
      new THREE.MeshLambertMaterial({color:0x2B241E}));
    perna.position.set(dx,.25,0); banco.add(perna);
  }
  banco.position.set(3.2,0,prof/2+2.2); banco.castShadow = true; g.add(banco);

  virarPraPraca(g, x, z);
  adicionarPlaca(nome, x, z, alt+2.3);
}

/* ---------- mercado: banca aberta com toldo, caixotes de fruta ---------- */
function construirMercado(nome, x, z){
  const g = new THREE.Group();
  const matMadeira = new THREE.MeshLambertMaterial({map:texturaMadeira("#7A5636")});

  const balcao = new THREE.Mesh(new THREE.BoxGeometry(6.4,1.1,1.3), matMadeira);
  balcao.position.set(0,.55,1.2); balcao.castShadow = balcao.receiveShadow = true; g.add(balcao);

  const matPoste = new THREE.MeshLambertMaterial({color:0x5C4630});
  const alturaPoste = 3.2;
  for(const [px,pz] of [[-3.1,-1.4],[3.1,-1.4],[-3.1,2.6],[3.1,2.6]]){
    const poste = new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,alturaPoste,8), matPoste);
    poste.position.set(px,alturaPoste/2,pz); poste.castShadow = true; g.add(poste);
  }

  const matToldo = new THREE.MeshLambertMaterial({map:texturaListrado("#B5463C","#EFE7D8"), side:THREE.DoubleSide});
  const toldo = new THREE.Mesh(new THREE.BoxGeometry(7.2,.12,4.6), matToldo);
  toldo.position.set(0,alturaPoste,.6); toldo.rotation.x = -.12; toldo.castShadow = true; g.add(toldo);

  const coresFruta = [0xC23B22,0xE0942C,0xD1C23B,0x7CA23B];
  for(let i=0;i<5;i++){
    const caixote = new THREE.Mesh(new THREE.BoxGeometry(.9,.5,.7), matMadeira);
    caixote.position.set(-2.6+i*1.3,1.35,1.2); caixote.castShadow = true; g.add(caixote);
    for(let j=0;j<4;j++){
      const fruta = new THREE.Mesh(new THREE.SphereGeometry(.16,8,6),
        new THREE.MeshLambertMaterial({color:coresFruta[(i+j)%coresFruta.length]}));
      fruta.position.set(-2.6+i*1.3+(Math.random()-.5)*.5, 1.66, 1.2+(Math.random()-.5)*.4);
      fruta.castShadow = true; g.add(fruta);
    }
  }
  for(const dx of [-3.6,3.6]){
    const cesta = new THREE.Mesh(new THREE.CylinderGeometry(.4,.32,.5,10),
      new THREE.MeshLambertMaterial({map:texturaMadeira("#8A6A42")}));
    cesta.position.set(dx,.25,2.2); cesta.castShadow = true; g.add(cesta);
  }

  virarPraPraca(g, x, z);
  adicionarPlaca(nome, x, z, alturaPoste+1.6);
}

/* ---------- casa genérica: usada só se world.json ganhar um lugar novo ---------- */
function construirCasaGenerica(nome, x, z, cor){
  const g = new THREE.Group();
  const larg = 9, prof = 8, alt = 5.4;

  const matParede = new THREE.MeshLambertMaterial({map:texturaParede("#D8D2C2")});
  const corpo = new THREE.Mesh(new THREE.BoxGeometry(larg,alt,prof), matParede);
  corpo.position.y = alt/2; corpo.castShadow = corpo.receiveShadow = true; g.add(corpo);

  const corHex = "#" + cor.toString(16).padStart(6,"0");
  const telhado = new THREE.Mesh(new THREE.ConeGeometry(larg*.82,2.9,4),
    new THREE.MeshLambertMaterial({map:texturaTelha(corHex)}));
  telhado.position.y = alt+1.45; telhado.rotation.y = Math.PI/4; telhado.castShadow = true; g.add(telhado);

  const matVidro = new THREE.MeshLambertMaterial({color:0x2E4A50});
  for(const dx of [-2.6,2.6]){
    const jan = new THREE.Mesh(new THREE.BoxGeometry(1.9,1.9,.12), matVidro);
    jan.position.set(dx,3.3,prof/2+.01); g.add(jan);
  }
  const porta = new THREE.Mesh(new THREE.BoxGeometry(1.9,3,.14),
    new THREE.MeshLambertMaterial({map:texturaMadeira("#5A4632")}));
  porta.position.set(0,1.5,prof/2+.01); g.add(porta);

  virarPraPraca(g, x, z);
  adicionarPlaca(nome, x, z, alt+2.1);
}

function letreiro(texto){
  const cv = document.createElement("canvas");
  cv.width = 512; cv.height = 128;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "rgba(18,26,23,.82)"; ctx.fillRect(0,0,512,128);
  ctx.strokeStyle = "rgba(232,234,228,.3)"; ctx.lineWidth = 4; ctx.strokeRect(2,2,508,124);
  ctx.fillStyle = "#E8EAE4"; ctx.font = "600 52px 'IBM Plex Sans',sans-serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(texto, 256, 68);
  const t = new THREE.CanvasTexture(cv);
  return new THREE.MeshBasicMaterial({map:t, transparent:true});
}

/* ---------- personagens (avatares VRM) ---------- */

// enquanto o modelo de verdade não carrega (ou se falhar), um marcador simples
// no lugar certo — assim a vila nunca trava esperando um avatar problemático
function montarPlaceholder(cor){
  const raiz = new THREE.Group();
  const corpo = new THREE.Mesh(
    new THREE.CylinderGeometry(.32,.4,ALTURA_PERSONAGEM*.55,8),
    new THREE.MeshLambertMaterial({color:cor}));
  corpo.position.y = ALTURA_PERSONAGEM*.55/2 + ALTURA_PERSONAGEM*.3; corpo.castShadow = true;
  const cabeca = new THREE.Mesh(new THREE.SphereGeometry(.28,10,8),
    new THREE.MeshLambertMaterial({color:0xC98F5E}));
  cabeca.position.y = ALTURA_PERSONAGEM*.85 + .28; cabeca.castShadow = true;
  raiz.add(corpo, cabeca);
  cena.add(raiz);
  return {raiz, ossos:{}, semOssos:true};
}

async function carregarPersonagem(nome, cor){
  const loader = new GLTFLoader();
  loader.register(parser => new VRMLoaderPlugin(parser));

  let vrm;
  try{
    const gltf = await loader.loadAsync(`modelos/${nome}.vrm`);
    vrm = gltf.userData.vrm;
  }catch(erro){
    console.warn(`Não consegui carregar o modelo de ${nome}:`, erro);
    return montarPlaceholder(cor);
  }

  VRMUtils.rotateVRM0(vrm);           // modelos VRM0 nascem de costas; corrige a frente
  vrm.scene.traverse(o => {
    if(o.isMesh || o.isSkinnedMesh){
      o.castShadow = true; o.receiveShadow = true;
      // malha com pele muda de forma a cada quadro; a esfera delimitadora
      // calculada na pose de repouso faz o motor descartar partes do corpo
      o.frustumCulled = false;
    }
  });

  // normaliza pra todo mundo ficar do mesmo tamanho na cena, não importa
  // a altura "real" de cada modelo em metros
  const caixa = new THREE.Box3().setFromObject(vrm.scene);
  const alturaNatural = (caixa.max.y - caixa.min.y) || 1.6;
  const escala = ALTURA_PERSONAGEM / alturaNatural;

  const raiz = new THREE.Group();
  raiz.add(vrm.scene);
  raiz.scale.setScalar(escala);
  cena.add(raiz);

  // a origem do modelo fica no QUADRIL, não nos pés: sem corrigir,
  // metade do corpo fica enterrada no chão. Levanta até o pé mais baixo
  // encostar em y=0.
  // sincroniza o esqueleto uma vez: só depois disso os ossos ficam onde
  // serão de fato desenhados (antes, medir dá valores errados)
  vrm.update(0);
  raiz.updateWorldMatrix(true, true);
  const humano = vrm.humanoid;
  const pontaPes = ["leftToes","rightToes","leftFoot","rightFoot"]
    .map(n => humano?.getRawBoneNode?.(n) || humano?.getNormalizedBoneNode?.(n))
    .filter(Boolean);
  if(pontaPes.length){
    const v = new THREE.Vector3();
    let maisBaixo = Infinity;
    for(const osso of pontaPes){ osso.getWorldPosition(v); maisBaixo = Math.min(maisBaixo, v.y); }
    const afundado = maisBaixo - raiz.position.y;      // negativo = abaixo do chão
    vrm.scene.position.y -= afundado / escala;          // scene vive dentro do raiz escalado
    raiz.updateWorldMatrix(true, true);
  }

  const ossos = {};
  for(const n of OSSOS_USADOS) ossos[n] = vrm.humanoid?.getNormalizedBoneNode(n) || null;

  // modelos VRM chegam em pose de T (braços na horizontal). Baixa os braços
  // pra uma pose natural — sem isso todo mundo anda pela vila de braços abertos.
  if(ossos.leftUpperArm)  ossos.leftUpperArm.rotation.z  =  1.20;
  if(ossos.rightUpperArm) ossos.rightUpperArm.rotation.z = -1.20;
  if(ossos.leftLowerArm)  ossos.leftLowerArm.rotation.z  =  0.22;
  if(ossos.rightLowerArm) ossos.rightLowerArm.rotation.z = -0.22;

  return {
    vrm, raiz, ossos, semOssos:false,
    // a posição do quadril É a altura dele: precisa ser guardada e só
    // oscilada em torno disso, senão o corpo inteiro afunda no chão
    quadrilY: ossos.hips ? ossos.hips.position.y : 0,
    alvo: new THREE.Vector3(), andando:false, fase: Math.random()*6,
    piscar: {t: 1+Math.random()*3, piscando:false, fase:0},
  };
}

function atualizarBlink(p, dt){
  if(!p.vrm?.expressionManager) return;
  const b = p.piscar;
  b.t -= dt;
  if(b.t <= 0 && !b.piscando){ b.piscando = true; b.fase = 0; b.t = 2.5 + Math.random()*3.5; }
  if(b.piscando){
    b.fase += dt/.12;
    const v = b.fase < 1 ? Math.sin(Math.min(b.fase,1)*Math.PI) : 0;
    p.vrm.expressionManager.setValue("blink", v);
    if(b.fase >= 1) b.piscando = false;
  }
}

/* ---------- câmera controlável ---------- */
const cam = {alvo:new THREE.Vector3(0,2.5,3), raio:44, giro:-Math.PI/2, incl:.42};
function posicionarCamera(){
  camera.position.set(
    cam.alvo.x + cam.raio*Math.cos(cam.incl)*Math.cos(cam.giro),
    cam.alvo.y + cam.raio*Math.sin(cam.incl),
    cam.alvo.z + cam.raio*Math.cos(cam.incl)*Math.sin(cam.giro));
  camera.lookAt(cam.alvo);
}
(function controles(){
  let arrastando=false, ux=0, uy=0;
  const alvo = document.body;
  alvo.addEventListener("pointerdown", e=>{ if(e.target.closest(".hud")) return;
    arrastando=true; ux=e.clientX; uy=e.clientY; });
  addEventListener("pointerup", ()=> arrastando=false);
  addEventListener("pointermove", e=>{
    if(!arrastando) return;
    cam.giro += (e.clientX-ux)*.006;
    cam.incl = Math.max(.14, Math.min(1.42, cam.incl + (e.clientY-uy)*.005));
    ux=e.clientX; uy=e.clientY;
  });
  addEventListener("wheel", e=>{ if(e.target.closest(".hud")) return;
    cam.raio = Math.max(20, Math.min(130, cam.raio + e.deltaY*.045)); }, {passive:true});
})();

/* ---------- laço de animação ---------- */
function animar(){
  requestAnimationFrame(animar);
  const dt = Math.min(relogio3d.getDelta(), .1);

  for(const [nome,p] of Object.entries(personagens)){
    if(!p.raiz) continue;
    const o = p.ossos || {};
    const dist = p.raiz.position.distanceTo(p.alvo);

    if(dist > .4){
      p.andando = true;
      const passo = Math.min(dist, 7.5*dt);
      const dir = p.alvo.clone().sub(p.raiz.position).normalize();
      p.raiz.position.addScaledVector(dir, passo);
      p.raiz.rotation.y = Math.atan2(dir.x, dir.z);

      if(!p.semOssos){
        p.fase += dt*8.5;
        const s = Math.sin(p.fase);
        if(o.leftUpperLeg)  o.leftUpperLeg.rotation.x  =  s*.5;
        if(o.rightUpperLeg) o.rightUpperLeg.rotation.x = -s*.5;
        if(o.leftLowerLeg)  o.leftLowerLeg.rotation.x  = Math.max(0, -s)*.75;
        if(o.rightLowerLeg) o.rightLowerLeg.rotation.x = Math.max(0,  s)*.75;
        if(o.leftUpperArm)  o.leftUpperArm.rotation.x  = -s*.4;
        if(o.rightUpperArm) o.rightUpperArm.rotation.x =  s*.4;
        if(o.hips) o.hips.position.y = p.quadrilY + Math.abs(s)*.03;
      }
    } else {
      p.andando = false;
      if(!p.semOssos){
        const k = Math.min(1, dt*8);
        for(const chave of ["leftUpperLeg","rightUpperLeg","leftLowerLeg","rightLowerLeg","leftUpperArm","rightUpperArm"]){
          if(o[chave]) o[chave].rotation.x *= 1-k;
        }
        if(o.hips) o.hips.position.y += (p.quadrilY - o.hips.position.y)*k;
      }
    }

    if(!p.semOssos){
      atualizarBlink(p, dt);
      p.vrm?.update(dt);
    }
  }

  cena.children.forEach(o => { if(o.userData.placa) o.quaternion.copy(camera.quaternion); });
  posicionarCamera();
  posicionarBaloes();
  render3d.render(cena, camera);
}

function posicionarBaloes(){
  // 1) projeta cada balão pra tela
  const ativos = [];
  for(const [nome,el] of Object.entries(baloes)){
    const pz = personagens[nome];
    if(!pz?.raiz || !el.classList.contains("on")) continue;
    const p = pz.raiz.position.clone(); p.y += ALTURA_PERSONAGEM + .3;
    p.project(camera);
    if(p.z > 1){ el.style.visibility = "hidden"; continue; }
    el.style.visibility = "";
    ativos.push({
      el,
      x: (p.x*.5+.5)*innerWidth,
      y: (-p.y*.5+.5)*innerHeight,
      w: el.offsetWidth,
      h: el.offsetHeight,
    });
  }

  // 2) mantém os balões fora dos painéis da interface
  const reg = $("registro");
  const visivel = reg && getComputedStyle(reg).display !== "none";
  const limiteDir = visivel ? reg.getBoundingClientRect().left - 12 : innerWidth - 12;
  for(const item of ativos){
    item.x = Math.min(limiteDir - item.w/2, Math.max(item.w/2 + 12, item.x));
  }

  // 3) resolve sobreposição: o mais baixo fica, os outros sobem
  const postos = [];
  ativos.sort((a,b) => b.y - a.y);
  for(const item of ativos){
    let mexeu = true, voltas = 0;
    while(mexeu && voltas++ < 12){
      mexeu = false;
      for(const outro of postos){
        const cruzaX = Math.abs(item.x - outro.x) < (item.w + outro.w)/2 + 8;
        const cruzaY = (item.y - item.h) < outro.y + 8 && item.y > (outro.y - outro.h) - 8;
        if(cruzaX && cruzaY){ item.y = outro.y - outro.h - 10; mexeu = true; }
      }
    }
    item.y = Math.max(item.h + 12, item.y);   // não deixa sair pelo topo
    postos.push(item);
    item.el.style.left = item.x + "px";
    item.el.style.top  = item.y + "px";
  }
}

addEventListener("resize", ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  render3d.setSize(innerWidth, innerHeight);
});

/* ---------- dados ---------- */
async function buscarEstado(){
  // 1) servidor local (viewer.py) — resposta pronta num pedido só
  try{
    const r = await fetch("api/estado", {cache:"no-store"});
    if(r.ok) return await r.json();
  }catch(e){ /* sem servidor: é site estático, cai no plano B */ }

  // 2) site estático (GitHub Pages): lê os arquivos direto do repositório
  const ler = async (caminho, padrao) => {
    try{
      const r = await fetch(caminho + "?t=" + Date.now(), {cache:"no-store"});
      return r.ok ? await r.json() : padrao;
    }catch(e){ return padrao; }
  };
  const [mundo, moradores, eventos, estado_atual] = await Promise.all([
    ler("../data/world.json", {}),
    ler("../data/agents.json", []),
    ler("../state/event_log.json", []),
    ler("../state/world_state.json", {}),
  ]);
  return {mundo, moradores, eventos, estado_atual};
}

async function puxar(){
  let d;
  try{ d = await buscarEstado(); }
  catch(e){ return; }

  if(d.mundo?.name){ $("titulo").textContent = d.mundo.name; }
  const primeiraVez = !Object.keys(locais).length;
  locais = d.mundo?.locations || {};

  for(const [i,p] of (d.moradores||[]).entries()){
    corDe[p.name] = CORES[i%CORES.length];
    inicioDe[p.name] = p.starting_location;
    if(personagens[p.name] || personagens[p.name] === "carregando") continue;

    personagens[p.name] = "carregando"; // trava a vaga até o modelo (~15MB) chegar
    const el = document.createElement("div");
    el.className = "balao";
    document.body.appendChild(el);
    baloes[p.name] = el;

    carregarPersonagem(p.name, corDe[p.name]).then(pz => {
      const [x,z] = ponto(p.starting_location);
      pz.raiz.position.set(x + (i-1)*2.2, 0, z + 5.5);
      pz.alvo = pz.alvo || new THREE.Vector3();
      pz.alvo.copy(pz.raiz.position);
      personagens[p.name] = pz;
      // o modelo leva segundos pra carregar e o aplicar() já rodou sem ele:
      // reposiciona agora, senão ele fica parado no ponto de origem
      aplicar();
    });
  }

  if(primeiraVez){
    for(const nome of Object.keys(locais)) montarPredio(nome, 0x8C5A3C);
    $("carregando").remove();
  }

  const eventos = d.eventos || [];
  const nova = eventos.length + "|" + Object.keys(locais).length;
  if(nova === assinatura) return;
  assinatura = nova;

  const porTick = new Map();
  for(const ev of eventos){
    if(!porTick.has(ev.tick)) porTick.set(ev.tick, []);
    porTick.get(ev.tick).push(ev);
  }
  const noFim = atual >= ticks.length-1;
  ticks = [...porTick.entries()].sort((a,b)=>a[0]-b[0]).map(([n,evs])=>({n,evs}));
  $("linha").max = Math.max(0, ticks.length-1);
  if(noFim || atual > ticks.length-1) atual = Math.max(0, ticks.length-1);

  const est = d.estado_atual?.state || d.mundo?.state || {};
  $("condicoes").innerHTML = Object.entries(est).map(([k,v])=>`${k}: <b>${esc(v)}</b>`).join(" · ");
  aplicar();
}

function aplicar(){
  const pos = {...inicioDe};
  for(let i=0;i<=atual && i<ticks.length;i++)
    for(const ev of ticks[i].evs)
      if(ev.agent !== "SISTEMA") pos[ev.agent] = ev.location;

  const porLugar = {};
  for(const [quem,lugar] of Object.entries(pos)) (porLugar[lugar] ||= []).push(quem);
  for(const [lugar,gente] of Object.entries(porLugar)){
    const [x,z] = ponto(lugar);
    const praca = lugar.includes("pra");
    gente.forEach((quem,i)=>{
      const pz = personagens[quem];
      if(!pz || pz === "carregando" || !pz.alvo) return;
      if(praca){
        // em roda ao redor do chafariz
        const ang = -Math.PI/2 + (i - (gente.length-1)/2) * .55;
        pz.alvo.set(x + Math.cos(ang)*7, 0, z + Math.sin(ang)*7);
      } else {
        const desvio = (i - (gente.length-1)/2) * 2.8;
        pz.alvo.set(x + desvio, 0, z + 7.5);
      }
    });
  }

  // balões com a fala do tick atual
  const agora = ticks[atual]?.evs || [];
  for(const [quem,el] of Object.entries(baloes)){
    const ev = agora.find(e => e.agent === quem);
    if(ev){
      const t = ev.action.length > 85 ? ev.action.slice(0,85)+"…" : ev.action;
      el.innerHTML = `<span class="dono" style="color:#${(corDe[quem]||0xE8EAE4).toString(16).padStart(6,"0")}">${esc(quem)}</span>${esc(t)}`;
      el.classList.add("on");
    } else el.classList.remove("on");
  }

  const falas = $("falas");
  if(!ticks.length) falas.innerHTML = `<p class="nada">Sem registros ainda.</p>`;
  else falas.innerHTML = ticks.slice(Math.max(0,atual-3), atual+1).map(t =>
    t.evs.map(ev => ev.agent === "SISTEMA"
      ? `<div class="evento">${esc(ev.action)}</div>`
      : `<div class="linha" style="color:#${(corDe[ev.agent]||0xE8EAE4).toString(16).padStart(6,"0")}">
           <span class="quem">${esc(ev.agent)}</span>
           <div class="txt">${esc(ev.action)}</div></div>`).join("")).join("");
  falas.scrollTop = falas.scrollHeight;

  $("relogio").textContent = `tick ${ticks.length ? ticks[atual].n : 0} / ${ticks.length}`;
  $("linha").value = atual;
}

function tocar(ligar){
  tocando = ligar;
  $("btnPlay").textContent = ligar ? "Pausar" : "Reproduzir";
  clearInterval(timer);
  if(ligar) timer = setInterval(()=>{
    if(atual < ticks.length-1){ atual++; aplicar(); } else tocar(false);
  }, 4200);
}
$("btnPlay").onclick = ()=>{ if(!tocando && atual >= ticks.length-1) atual = 0; tocar(!tocando); };
$("linha").oninput = e => { tocar(false); atual = +e.target.value; aplicar(); };

montarCena();
puxar();
setInterval(puxar, 3000);

// escopo de módulo é fechado: expõe o essencial pra depuração
window.vila = { get personagens(){return personagens;}, get ticks(){return ticks;}, cam };
</script>
